# 双端桌面构建：tag v* 或手动触发
name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (verbose)
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee tauri-build.log

      - name: Publish log to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tauri build log (${{ matrix.platform }})"
            echo ""
            echo '```'
            # keep summary under size limits
            tail -n 200 tauri-build.log 2>/dev/null || echo "(no log file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.platform }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Upload bundles
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zdream-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          echo "Tauri build failed on ${{ matrix.platform }}"
          tail -n 80 tauri-build.log || true
          exit 1
