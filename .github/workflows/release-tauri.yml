# 双端桌面构建：tag v* 或手动触发
name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (verbose)
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee tauri-build.log
        continue-on-error: true
        id: build

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.platform }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Upload bundles
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zdream-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/release/*.exe
            src-tauri/target/release/zdream
            src-tauri/target/release/zdream.exe
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Tauri build failed. See artifact tauri-build-log-${{ matrix.platform }}"
          tail -n 100 tauri-build.log || true
          exit 1
