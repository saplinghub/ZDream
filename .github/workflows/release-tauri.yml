# Windows 桌面构建 + 自动发 GitHub Release：tag v* 或手动触发
# macOS 暂时关闭，开发阶段节省构建时间，成熟后再放开
name: Release Tauri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: macos-latest   # TODO: 开发成熟后恢复
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (verbose)
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npx tauri build --verbose 2>&1 | tee tauri-build.log

      - name: Publish log to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tauri build log (${{ matrix.platform }})"
            echo ""
            echo '```text'
            tail -n 250 tauri-build.log 2>/dev/null || echo "(no log file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue with failure log
        if: steps.build.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no log)';
            try {
              body = fs.readFileSync('tauri-build.log', 'utf8');
            } catch (e) {
              body = String(e);
            }
            if (body.length > 50000) {
              body = body.slice(-50000);
            }
            const title = `[ci] Tauri build failed on ${{ matrix.platform }} (${context.ref})`;
            const issueBody = [
              `**Platform:** \`${{ matrix.platform }}\``,
              `**Ref:** \`${context.ref}\``,
              `**SHA:** \`${context.sha}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '<details><summary>tauri-build.log (tail)</summary>',
              '',
              '```text',
              body,
              '```',
              '',
              '</details>'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: []
            });

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.platform }}
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Upload bundles
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zdream-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          echo "Tauri build failed on ${{ matrix.platform }}"
          tail -n 80 tauri-build.log || true
          exit 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # TODO: macOS 恢复时取消注释
      # - name: Download macOS artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: zdream-macos-latest
      #     path: bundles

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zdream-windows-latest
          path: bundles

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find bundles -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
